<!DOCTYPE html>
<html>
    <head>
        <title>DIY Studio App - Loading Screen</title>
        <meta name="viewport" content="initial-scale=1" />
        <style>
            html, body {
                width: 100vw;
                height: 100vh;
                margin: 0;
                padding: 0;
                overflow: hidden;
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: Arial, Helvetica, sans-serif;
                color: #ffcd00;
				background-color: #444444;
            }

            div#container {
                width: 938px;
                height: 200px;
				margin-top: 0px;
                background-color: #444444;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
        </style>
    </head>
    <script>
        window.addEventListener("load", () => {
            // Only notify when served by the local HTTP listener.
            if (window.location.protocol !== "http:") {
                return;
            }

            async function notifyReady() {
                try {
                    const response = await fetch("/ready", {
                        method: "POST",
                        cache: "no-store",
                    });

                    if (response.ok) {
                        return;
                    }
                } catch {
                    // Retry if the notification could not be delivered.
                }

                window.setTimeout(notifyReady, 1000);
            }

            notifyReady();
        }, { once: true });
    </script>
    <body>
        <div id="container">
			<h1>Bezig met opstarten, een moment geduld a.u.b.</h1>
			<h2>Loading application, one moment please</h2>
        </div>

    </body>
</html>
